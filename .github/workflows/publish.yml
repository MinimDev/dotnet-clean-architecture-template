name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'   # Trigger on version tags: v1.7.0, v1.7.0-beta, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack and publish (e.g. 1.7.0-beta)'
        required: false
        default: '1.7.0-beta'

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # Required for requesting the OIDC JWT token from GitHub
      contents: write    # Required for creating GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.7.0-beta" >> $GITHUB_OUTPUT
          fi

      - name: Update version in .csproj
        run: |
          sed -i "s|<Version>.*</Version>|<Version>${{ steps.version.outputs.VERSION }}</Version>|" \
            Minimdev.CleanArchitecture.Template.csproj

      - name: Pack
        run: dotnet pack Minimdev.CleanArchitecture.Template.csproj --configuration Release -o ./artifacts

      - name: NuGet Login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: MinimDev

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
          body: |
            ## Installation
            ```bash
            dotnet new install Minimdev.CleanArchitecture.Template::${{ steps.version.outputs.VERSION }}
            ```
            See [CHANGELOG.md](https://github.com/MinimDev/dotnet-clean-architecture-template/blob/main/CHANGELOG.md) for details.
